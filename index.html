<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a1a">
<title>🐍 多巴胺贪吃蛇</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;
  font-family:'Fredoka One','PingFang SC','Microsoft YaHei',sans-serif;background:#0d0a1a}
body{display:flex;flex-direction:column}
.hud{display:flex;justify-content:center;gap:6px;padding:6px 10px;flex-wrap:wrap;
  background:linear-gradient(135deg,#FF6B9D22,#C44DFF22,#4DDBFF22);z-index:5;flex-shrink:0}
.hi{background:rgba(255,255,255,0.12);border-radius:10px;padding:4px 12px;
  color:#fff;font-size:13px;border:1px solid rgba(255,255,255,0.2);white-space:nowrap}
.fever-bar{display:none;width:100%;text-align:center;padding:3px;color:#fff;font-size:16px;
  font-weight:bold;background:linear-gradient(135deg,#FF6B9D,#FFE44D,#4DDBFF,#C44DFF);
  background-size:300% 300%;animation:gs 2s ease infinite;flex-shrink:0}
@keyframes gs{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.gw{flex:1;position:relative;overflow:hidden;min-height:0}
canvas{display:block;width:100%;height:100%}
.hb{position:absolute;z-index:6;background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25);border-radius:8px;color:#fff;
  font-size:16px;padding:5px 10px;cursor:pointer;top:6px}
.hb.p{right:44px}.hb.s{right:6px}
.sp{position:absolute;top:42px;right:6px;z-index:7;background:rgba(0,0,0,0.85);
  border-radius:12px;padding:12px 16px;border:1px solid rgba(255,255,255,0.2);
  display:none;color:#fff;min-width:140px}
.sp .sr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
  font-size:13px;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.tg{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,0.15);
  position:relative;cursor:pointer;transition:background 0.2s;border:1px solid rgba(255,255,255,0.3)}
.tg.on{background:#6BFF9D;border-color:#6BFF9D}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:transform 0.2s}
.tg.on::after{transform:translateX(18px)}
.ov{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.85);border-radius:18px;padding:24px 20px;text-align:center;
  color:#fff;border:2px solid rgba(255,255,255,0.2);z-index:20;width:min(85vw,360px)}
.ov h2{font-size:24px;margin-bottom:6px;
  background:linear-gradient(90deg,#FF6B9D,#FFE44D,#4DDBFF,#C44DFF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ov p{font-size:13px;margin-bottom:4px;opacity:0.85;line-height:1.4}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:10px 0;text-align:left}
.sg .sl{font-size:11px;opacity:0.7}.sg .sv{font-size:16px;color:#FFE44D}
.btn{margin-top:12px;padding:10px 28px;font-size:16px;font-family:inherit;border:none;
  border-radius:50px;background:linear-gradient(135deg,#FF6B9D,#C44DFF);color:#fff;
  cursor:pointer;box-shadow:0 4px 16px rgba(196,77,255,0.4);transition:transform 0.15s}
.btn:active{transform:scale(0.96)}
.to{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);border-radius:18px;padding:22px 16px;text-align:center;
  color:#fff;border:2px solid rgba(255,255,255,0.2);z-index:25;width:min(90vw,400px)}
.to h2{font-size:22px;margin-bottom:4px;
  background:linear-gradient(90deg,#FFE44D,#FF6B9D,#C44DFF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.to .ts{font-size:11px;opacity:0.5;margin-bottom:12px}
.tc{display:flex;gap:8px;justify-content:center}
.td{flex:1;max-width:120px;padding:14px 6px;border-radius:12px;
  background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);
  cursor:pointer;transition:all 0.2s;text-align:center}
.td:active{transform:scale(0.95);border-color:#FFE44D;background:rgba(255,255,255,0.12)}
.td.lg{border-color:#FFD700;background:rgba(255,215,0,0.06)}
.td .ti{font-size:28px;margin-bottom:4px}
.td .tn{font-size:12px;font-weight:bold;margin-bottom:4px;color:#FFE44D}
.td.lg .tn{color:#FFD700}
.td .tx{font-size:9px;opacity:0.7;line-height:1.3;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
</style>
</head>
<body>
<div class="hud">
  <div class="hi">🍬 <span id="sc">0</span></div>
  <div class="hi">🏆 <span id="bs">0</span></div>
  <div class="hi">⚡ Lv.<span id="sp">1</span></div>
  <div class="hi" id="cb" style="display:none">🔥 <span id="ct">x0</span></div>
</div>
<div class="fever-bar" id="fb">🔥 FEVER <span id="ft">10</span></div>
<div class="gw" id="gw">
  <canvas id="cv"></canvas>
  <button class="hb p" id="pb">⏸</button>
  <button class="hb s" id="sb">⚙️</button>
  <div class="sp" id="spanel">
    <div class="sr"><span>🎵 音乐</span><div class="tg on" id="mt"></div></div>
    <div class="sr"><span>🔊 音效</span><div class="tg on" id="st"></div></div>
  </div>
  <div class="ov" id="ss"><h2>🐍 多巴胺贪吃蛇</h2>
    <p>360°自由移动 · 摇杆控制方向</p><p>吃果实连击 · 找彩虹狂欢 · 抢宝箱</p>
    <button class="btn" id="sbtn">🎮 开始游戏</button></div>
  <div class="ov" id="go" style="display:none"><h2>💥 游戏结束</h2>
    <p>🏆 得分: <span id="fs" style="font-size:26px;color:#FFE44D">0</span></p>
    <p id="nr" style="display:none;color:#FF6B9D;font-size:15px">🎉 新纪录！</p>
    <div class="sg"><div class="sl">⭐ 最高</div><div class="sl">🔥 最大Combo</div>
      <div class="sv" id="gb">0</div><div class="sv" id="gc">0</div>
      <div class="sl">🌈 Fever</div><div class="sl">🎁 宝箱</div>
      <div class="sv" id="gf">0</div><div class="sv" id="gch">0</div>
      <div class="sl">⏱ 时间</div><div class="sl"></div>
      <div class="sv" id="gt">00:00</div><div class="sv"></div></div>
    <button class="btn" id="rb">🔄 再挑战一次</button></div>
  <div class="to" id="tp" style="display:none"><h2>⚡ 选择天赋</h2>
    <p class="ts">选择一个天赋强化你的蛇</p><div class="tc" id="tcs"></div></div>
  <div class="ov" id="ps" style="display:none"><h2>⏸️ 暂停中</h2>
    <p>点击继续</p><button class="btn" id="rsb">▶️ 继续</button></div>
</div>
<script>
// ===== 世界配置 =====
const WW=2400,WH=3360,BASE_SPD=155,SPD_INC=7,MAX_SPD=420;
const HEAD_R=11,BODY_R=9,BODY_SPACE=13,COLL_D=17;
const TURN_SPD=4.8,FOOD_R=18,CHEST_R=28;
const FOOD_N=25,TRAIL_MAX=2500;
const DC={head:'#FF6B9D',body:['#FF6B9D','#FF9D4D','#FFE44D','#6BFF9D','#4DDBFF','#4D7FFF','#C44DFF','#FF4DCF'],
  rainbow:['#FF6B9D','#FF9D4D','#FFE44D','#6BFF9D','#4DDBFF','#C44DFF'],
  food:['#FF6B9D','#FFE44D','#4DDBFF','#C44DFF','#6BFF9D','#FF9D4D','#FF4DCF','#4D7FFF'],
  bg1:'#0d0a1a',bg2:'#150f2a'};

// ===== 天赋 =====
const TALS=[
  {id:'agile',icon:'🏃',name:'灵巧身法',desc:'转向速度提升40%'},
  {id:'compress',icon:'✂️',name:'蛇身压缩',desc:'身体长度减少20%'},
  {id:'revive',icon:'🍀',name:'幸运护符',desc:'获得一次复活机会'},
  {id:'comboUp',icon:'🔥',name:'连击大师',desc:'Combo窗口 3秒→5秒'},
  {id:'feverUp',icon:'🌈',name:'彩虹祝福',desc:'Fever时间 10秒→15秒'},
  {id:'magnetUp',icon:'🧲',name:'磁铁大师',desc:'吸附范围+50%'},
  {id:'slowGrow',icon:'🐌',name:'时间缓流',desc:'速度成长降低30%'}];
const TAL_L={id:'timeGuard',icon:'⏳',name:'时光守护',desc:'永久冻结速度',legendary:true};

// ===== 画布 =====
const cv=document.getElementById('cv'),cx=cv.getContext('2d',{alpha:false});
const gw=document.getElementById('gw');
let cW,cH,scale,vw,vh;
function resize(){cW=gw.clientWidth;cH=gw.clientHeight;cv.width=cW;cv.height=cH;
  scale=Math.min(cW/520,cH/700);vw=cW/scale;vh=cH/scale}
resize();window.addEventListener('resize',resize);

// ===== 音频 =====
let AC,mG,muG,sG;let muOn=true,sfOn=true,muT=null,muS=0,muC=0;
try{const s=JSON.parse(localStorage.getItem('sa'));if(s){muOn=s.m!==false;sfOn=s.s!==false}}catch(e){}
function gA(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();
  mG=AC.createGain();mG.connect(AC.destination);
  muG=AC.createGain();muG.gain.value=muOn?0.55:0;muG.connect(mG);
  sG=AC.createGain();sG.gain.value=sfOn?1:0;sG.connect(mG)}catch(e){}return AC}
const CH=[[262,330,392,523],[220,262,330,440],[175,220,262,349],[196,247,294,392]];
const AR=[0,1,2,3,2,1,0,2];
function stMu(){const a=gA();if(!a||muT)return;
  muT=setInterval(()=>{if(!muOn)return;const n=CH[muC],f=n[AR[muS%AR.length]],t=a.currentTime;
    const o=a.createOscillator(),g=a.createGain(),fi=a.createBiquadFilter();
    fi.type='lowpass';fi.frequency.value=1600+Math.sin(muS*0.3)*400;
    o.type='triangle';o.frequency.value=f;const d=60/136/2*0.75;
    g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(fi);fi.connect(g);g.connect(muG);o.start(t);o.stop(t+d);
    if(muS%4===0){const bo=a.createOscillator(),bg=a.createGain(),bf=a.createBiquadFilter();
      bf.type='lowpass';bf.frequency.value=300;bo.type='sawtooth';bo.frequency.value=f/4;
      bg.gain.setValueAtTime(0.03,t);bg.gain.exponentialRampToValueAtTime(0.001,t+d*2);
      bo.connect(bf);bf.connect(bg);bg.connect(muG);bo.start(t);bo.stop(t+d*2)}
    muS++;if(muS>=8){muS=0;muC=(muC+1)%4}},60/136/2*1000)}
function spMu(){if(muT){clearInterval(muT);muT=null}}
function sfx(fn){if(!sfOn)return;try{fn()}catch(e){}}
function sfClick(){sfx(()=>{const a=gA(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=880;g.gain.setValueAtTime(0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.03);o.connect(g);g.connect(sG);o.start(t);o.stop(t+0.03)})}
function sfEat(c){sfx(()=>{const a=gA(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=500+Math.min(c,5)*80;g.gain.setValueAtTime(0.4,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.connect(g);g.connect(sG);o.start(t);o.stop(t+0.12)})}
function sfCombo(c){sfx(()=>{const a=gA(),t=a.currentTime;[523,659].forEach((f,i)=>{
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f+c*50;
  g.gain.setValueAtTime(0.3,t+i*0.05);g.gain.exponentialRampToValueAtTime(0.001,t+0.15+i*0.05);
  o.connect(g);g.connect(sG);o.start(t+i*0.05);o.stop(t+0.15+i*0.05)})})}
function sfFever(){sfx(()=>{const a=gA(),t=a.currentTime;[523,659,784,1047].forEach((f,i)=>{
  const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(0.35,t+0.06*i);g.gain.exponentialRampToValueAtTime(0.001,t+0.12*(i+1));
  o.connect(g);g.connect(sG);o.start(t+0.06*i);o.stop(t+0.12*(i+1))})})}
function sfChest(){sfx(()=>{const a=gA(),t=a.currentTime;[440,554,659].forEach((f,i)=>{
  const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.35,t+0.08*i);g.gain.exponentialRampToValueAtTime(0.001,t+0.18*(i+1));
  o.connect(g);g.connect(sG);o.start(t+0.08*i);o.stop(t+0.18*(i+1))})})}
function sfDeath(){sfx(()=>{const a=gA(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';o.frequency.value=300;o.frequency.exponentialRampToValueAtTime(80,t+0.35);
  g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  o.connect(g);g.connect(sG);o.start(t);o.stop(t+0.4)})}
function sfTalent(){sfx(()=>{const a=gA(),t=a.currentTime;[659,880,1047,1319].forEach((f,i)=>{
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.28,t+0.06*i);g.gain.exponentialRampToValueAtTime(0.001,t+0.12*(i+1));
  o.connect(g);g.connect(sG);o.start(t+0.06*i);o.stop(t+0.12*(i+1))})})}
function sfRevive(){sfx(()=>{const a=gA(),t=a.currentTime;[392,523,659,784].forEach((f,i)=>{
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.22,t+0.08*i);g.gain.exponentialRampToValueAtTime(0.001,t+0.15*(i+1));
  o.connect(g);g.connect(sG);o.start(t+0.08*i);o.stop(t+0.15*(i+1))})})}

// ===== 音频设置 =====
const mtE=document.getElementById('mt'),stE=document.getElementById('st');
function updT(){mtE.classList.toggle('on',muOn);stE.classList.toggle('on',sfOn)}
function savA(){localStorage.setItem('sa',JSON.stringify({m:muOn,s:sfOn}))}
document.getElementById('sb').onclick=()=>{const p=document.getElementById('spanel');
  p.style.display=p.style.display==='block'?'none':'block'};
mtE.onclick=()=>{muOn=!muOn;updT();savA();if(muG)muG.gain.value=muOn?0.55:0;
  if(!muOn)spMu();else if(running&&!paused)stMu()};
stE.onclick=()=>{sfOn=!sfOn;updT();savA();if(sG)sG.gain.value=sfOn?1:0};
updT();

// ===== 游戏状态 =====
let snake,sx,sy,sHeading,sSpeed,spdLv;
let trail,score,bestSc,combo,lastEat,maxC,startTime;
let feverOn,feverEnd,normCnt,feverCnt,foods,chests;
let magOn,magEnd,invOn,invEnd,nextSpdAt,chestCnt;
let talSet,talTrig,talDone,revAvail,cWinB,fDurB,magRB,spdGR,spdFrz;
let particles,fTexts,trailP,flashA,paused,running,lastTs;
let jActive=false,jCX=0,jCY=0,jDX=0,jDY=0,jTouch=null;
bestSc=parseInt(localStorage.getItem('snb')||'0');document.getElementById('bs').textContent=bestSc;

// ===== 装饰粒子 =====
let decos=[];
function initDecos(){decos=[];for(let i=0;i<40;i++)decos.push({
  x:Math.random()*WW,y:Math.random()*WH,r:1.5+Math.random()*2.5,
  c:DC.food[Math.floor(Math.random()*DC.food.length)],
  vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,ph:Math.random()*6.28})}

// ===== 食物生成 =====
function mkFood(type){
  const margin=100;let x,y;
  do{x=margin+Math.random()*(WW-2*margin);y=margin+Math.random()*(WH-2*margin)}
  while(Math.hypot(x-sx,y-sy)<150);
  const r=Math.random();let tp=type;
  if(!tp){if(r<0.05)tp='rainbow';else if(r<0.2)tp='gold';else tp='normal'}
  return{x,y,type:tp,color:tp==='rainbow'?'#FFE44D':tp==='gold'?'#FFD700':DC.food[Math.floor(Math.random()*DC.food.length)]}}
function mkChest(){const m=200;return{x:m+Math.random()*(WW-2*m),y:m+Math.random()*(WH-2*m)}}
function ensureFood(){while(foods.length<FOOD_N)foods.push(mkFood())}

// ===== 粒子 =====
function addP(wx,wy,col,n){for(let i=0;i<(n||8);i++){const a=Math.PI*2/(n||8)*i+Math.random()*0.5,
  sp=1.5+Math.random()*2.5;particles.push({x:wx,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
  life:1,color:col,size:1.5+Math.random()*2.5})}}
function addFT(txt,wx,wy,col,sz){fTexts.push({text:txt,x:wx,y:wy,color:col,size:sz||16,life:1,vy:-0.8})}

// ===== 游戏启动 =====
function startGame(){
  ['ss','go','ps','tp'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('fb').style.display='none';document.getElementById('cb').style.display='none';
  sx=WW/2;sy=WH/2;sHeading=-Math.PI/2;sSpeed=BASE_SPD;spdLv=1;
  trail=[];for(let i=0;i<20;i++)trail.push({x:sx+i*2,y:sy});
  score=0;combo=0;lastEat=0;maxC=0;startTime=performance.now();
  feverOn=false;feverEnd=0;normCnt=0;feverCnt=0;
  foods=[];chests=[];chestCnt=0;magOn=false;invOn=false;nextSpdAt=5;
  talSet=new Set();talTrig=[50,100,200];talDone=new Set();
  revAvail=0;cWinB=0;fDurB=0;magRB=0;spdGR=0;spdFrz=false;
  particles=[];fTexts=[];trailP=[];flashA=0;paused=false;running=true;lastTs=0;
  snake={len:15,grow:0};
  document.getElementById('sc').textContent='0';document.getElementById('sp').textContent='1';
  ensureFood();initDecos();
  gA();if(AC&&AC.state==='suspended')AC.resume();if(muOn)stMu();
  requestAnimationFrame(loop);
}

// ===== 摇杆 =====
const JR=110,JDEAD=0.15;
function jStart(tx,ty){jActive=true;jCX=tx;jCY=ty;jDX=0;jDY=0;jTouch=true}
function jMove(tx,ty){if(!jActive)return;let dx=tx-jCX,dy=ty-jCY;
  const d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR}
  const nd=Math.hypot(dx,dy)/JR;if(nd<JDEAD){jDX=0;jDY=0}else{
    const f=(nd-JDEAD)/(1-JDEAD);jDX=dx/JR*f;jDY=dy/JR*f}}
function jEnd(){jActive=false;jDX=0;jDY=0;jTouch=null}

cv.addEventListener('touchstart',e=>{e.preventDefault();if(!running||paused)return;
  const t=e.touches[0],r=cv.getBoundingClientRect();jStart(t.clientX-r.left,t.clientY-r.top)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!jActive)return;
  const t=e.touches[0],r=cv.getBoundingClientRect();jMove(t.clientX-r.left,t.clientY-r.top)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();jEnd()},{passive:false});
cv.addEventListener('touchcancel',e=>{jEnd()},{passive:false});
let mDown=false;
cv.addEventListener('mousedown',e=>{if(!running||paused)return;mDown=true;
  const r=cv.getBoundingClientRect();jStart(e.clientX-r.left,e.clientY-r.top)});
cv.addEventListener('mousemove',e=>{if(!mDown)return;const r=cv.getBoundingClientRect();jMove(e.clientX-r.left,e.clientY-r.top)});
cv.addEventListener('mouseup',()=>{mDown=false;jEnd()});
cv.addEventListener('mouseleave',()=>{if(mDown){mDown=false;jEnd()}});

// ===== 键盘 =====
document.addEventListener('keydown',e=>{
  if(e.key==='p'){togglePause();return}
  if(e.key===' '&&!running){startGame();e.preventDefault();return}
  if(!running||paused)return;
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){sHeading-=TURN_SPD*0.05;e.preventDefault()}
  if(k==='arrowright'||k==='d'){sHeading+=TURN_SPD*0.05;e.preventDefault()}});

// ===== 更新 =====
function update(dt,ts){
  // 摇杆转向
  const jm=Math.hypot(jDX,jDY);
  if(jm>JDEAD){
    const ta=Math.atan2(jDY,jDX);
    let diff=ta-sHeading;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    const maxTurn=TURN_SPD*(talSet.has('agile')?1.4:1)*dt;
    if(Math.abs(diff)<=maxTurn)sHeading=ta;
    else sHeading+=Math.sign(diff)*maxTurn;
  }

  // 速度
  const curSpd=feverOn?sSpeed*0.9:sSpeed;
  // 移动
  const dx=Math.cos(sHeading)*curSpd*dt,dy=Math.sin(sHeading)*curSpd*dt;
  sx+=dx;sy+=dy;

  // 记录轨迹
  const last=trail[0];
  if(!last||Math.hypot(sx-last.x,sy-last.y)>3){trail.unshift({x:sx,y:sy});if(trail.length>TRAIL_MAX)trail.pop()}

  // 边界检测
  const margin=HEAD_R;
  if(sx<margin||sx>WW-margin||sy<margin||sy>WH-margin){
    if(invOn&&ts<invEnd){sHeading+=Math.PI;sx=Math.max(margin,Math.min(WW-margin,sx));sy=Math.max(margin,Math.min(WH-margin,sy))}
    else if(revAvail>0){doRevive(ts)}
    else{sfDeath();gameOver();return}
  }

  // 自碰撞
  const totalSegs=snake.len+snake.grow;
  const skipSegs=8;
  if(!invOn||ts>=invEnd){
    for(let i=skipSegs;i<totalSegs;i++){
      const ti=i*BODY_SPACE;if(ti>=trail.length)break;
      const bp=trail[ti];const d=Math.hypot(sx-bp.x,sy-bp.y);
      if(d<COLL_D){if(revAvail>0){doRevive(ts);break}sfDeath();gameOver();return}}}

  // 磁铁 & 超时效果
  if(magOn&&ts>=magEnd)magOn=false;
  if(invOn&&ts>=invEnd)invOn=false;
  if(feverOn&&ts>=feverEnd){feverOn=false;document.getElementById('fb').style.display='none'}

  // 吃食物
  let ate=false;
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i],d=Math.hypot(sx-f.x,sy-f.y);
    // 磁铁
    if(magOn&&ts<magEnd&&d<120+magRB*40){const a=Math.atan2(sy-f.y,sx-f.x);
      f.x+=Math.cos(a)*3;f.y+=Math.sin(a)*3}
    if(d<FOOD_R+HEAD_R){ate=true;
      if(f.type==='rainbow'){feverOn=true;feverEnd=ts+10000+fDurB;feverCnt++;sfFever();
        addFT('🔥 FEVER!',sx,sy-20,'#FFE44D',22);document.getElementById('fb').style.display='';
        addP(sx,sy,'#FFE44D',14);if(navigator.vibrate)navigator.vibrate(30)}
      else{const pts=f.type==='gold'?5:1;
        const cw=3000+cWinB;if(ts-lastEat<=cw&&lastEat>0)combo++;else combo=1;
        lastEat=ts;if(combo>maxC)maxC=combo;
        const cm=Math.min(combo,5),fm=feverOn?2:1;score+=pts*cm*fm;
        if(combo>=2){addFT('COMBO x'+combo,sx,sy-30,combo>=5?'#FFE44D':'#FF6B9D',combo>=5?20:16);
          document.getElementById('cb').style.display='';document.getElementById('ct').textContent='x'+combo;sfCombo(combo)}
        sfEat(combo);snake.grow+=pts;
        if(!spdFrz){while(score>=nextSpdAt){spdLv++;const inc=SPD_INC*(1-spdGR);
          sSpeed=Math.min(MAX_SPD,sSpeed+inc);document.getElementById('sp').textContent=spdLv;nextSpdAt+=5}}
      }
      normCnt++;addP(f.x,f.y,f.color,6);foods.splice(i,1)}}

  // 吃宝箱
  for(let i=chests.length-1;i>=0;i--){const c=chests[i];
    if(Math.hypot(sx-c.x,sy-c.y)<CHEST_R+HEAD_R){chests.splice(i,1);chestCnt++;sfChest();openChest(ts);
      cv.style.transition='transform 0.1s ease';cv.style.transform='scale(1.02)';
      setTimeout(()=>{cv.style.transform='scale(1)';setTimeout(()=>cv.style.transition='',100)},100);
      if(navigator.vibrate)navigator.vibrate(20)}}

  // 生成宝箱
  if(score>0&&score%50<5&&chests.length<2&&Math.random()<0.01)chests.push(mkChest());
  ensureFood();

  // 更新HUD
  document.getElementById('sc').textContent=score;
  if(feverOn){document.getElementById('ft').textContent=Math.ceil((feverEnd-ts)/1000)}
  const cw2=3000+cWinB;
  if(combo>0&&ts-lastEat>cw2){combo=0;document.getElementById('cb').style.display='none'}

  // 天赋触发
  for(const t of talTrig){if(score>=t&&!talDone.has(t)){talDone.add(t);showTal();return}}

  // 更新装饰
  for(const d of decos){d.x+=d.vx;d.y+=d.vy;
    if(d.x<0)d.x=WW;if(d.x>WW)d.x=0;if(d.y<0)d.y=WH;if(d.y>WH)d.y=0}

  // 更新粒子
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life-=0.035;p.size*=0.97;
    if(p.life<=0)particles.splice(i,1)}
  for(let i=fTexts.length-1;i>=0;i--){const f=fTexts[i];f.y+=f.vy;f.life-=0.018;
    if(f.life<=0)fTexts.splice(i,1)}
  // Combo≥5尾迹
  if(combo>=5&&trail.length>snake.len*BODY_SPACE){
    const ti=(snake.len-1)*BODY_SPACE;if(ti<trail.length){const tp=trail[ti];
      for(let j=0;j<3;j++)trailP.push({x:tp.x+(Math.random()-0.5)*8,y:tp.y+(Math.random()-0.5)*8,
        life:0.7,color:DC.body[Math.floor(Math.random()*DC.body.length)],size:2+Math.random()*2})}}
  for(let i=trailP.length-1;i>=0;i--){const p=trailP[i];p.life-=0.03;p.size*=0.96;
    if(p.life<=0)trailP.splice(i,1)}
}

function doRevive(ts){revAvail--;const rm=Math.floor((snake.len+snake.grow)*0.2);
  for(let i=0;i<rm&&snake.len>5;i++)snake.len--;
  invOn=true;invEnd=ts+2500;sHeading+=Math.PI;
  addFT('🍀 复活!',sx,sy-20,'#6BFF9D',20);addP(sx,sy,'#6BFF9D',10);sfRevive()}

function openChest(ts){const r=Math.random();
  if(r<0.4){score+=20;document.getElementById('sc').textContent=score;addFT('🎁 +20分',sx,sy,'#FFD700',20)}
  else if(r<0.6){const rm=Math.floor((snake.len+snake.grow)*0.3);for(let i=0;i<rm&&snake.len>5;i++)snake.len--;
    addFT('✂️ 缩短',sx,sy,'#6BFF9D',18)}
  else if(r<0.8){magOn=true;magEnd=ts+10000;addFT('🧲 磁铁',sx,sy,'#4DDBFF',18)}
  else if(r<0.9){invOn=true;invEnd=ts+5000;addFT('⭐ 无敌',sx,sy,'#FFE44D',18)}
  else{feverOn=true;feverEnd=ts+10000+fDurB;feverCnt++;document.getElementById('fb').style.display='';
    addFT('🔥 超级狂欢!',sx,sy,'#FF6B9D',22);sfFever()}}

// ===== 天赋 =====
function showTal(){paused=true;const c=document.getElementById('tcs');c.innerHTML='';
  const pool=[...TALS],ch=[];
  if(Math.random()<0.05&&!talSet.has('timeGuard'))ch.push(TAL_L);
  while(ch.length<3&&pool.length>0){const i=Math.floor(Math.random()*pool.length);ch.push(pool.splice(i,1)[0])}
  ch.forEach(t=>{const d=document.createElement('div');d.className='td'+(t.legendary?' lg':'');
    d.innerHTML=`<div class="ti">${t.icon}</div><div class="tn">${t.name}</div><div class="tx">${t.desc}</div>`;
    d.onclick=()=>selTal(t);c.appendChild(d)});
  document.getElementById('tp').style.display='block'}
function selTal(t){document.getElementById('tp').style.display='none';
  talSet.add(t.id);sfTalent();if(t.legendary)flashA=0.7;
  switch(t.id){case'agile':break;
    case'compress':{const rm=Math.floor((snake.len+snake.grow)*0.2);
      for(let i=0;i<rm&&snake.len>5;i++)snake.len--;addFT('✂️ 压缩',sx,sy,'#6BFF9D',18);break}
    case'revive':revAvail=1;addFT('🍀 复活就绪',sx,sy,'#6BFF9D',18);break;
    case'comboUp':cWinB=2000;addFT('🔥 连击+2s',sx,sy,'#FF6B9D',18);break;
    case'feverUp':fDurB=5000;addFT('🌈 Fever+5s',sx,sy,'#C44DFF',18);break;
    case'magnetUp':magRB=1.5;addFT('🧲 +50%',sx,sy,'#4DDBFF',18);break;
    case'slowGrow':spdGR=0.3;addFT('🐌 速度-30%',sx,sy,'#FFE44D',18);break;
    case'timeGuard':spdFrz=true;addFT('⏳ 冻结',sx,sy,'#FFD700',20);break}
  paused=false}

// ===== 绘制 =====
function draw(ts){
  cx.fillStyle=DC.bg1;cx.fillRect(0,0,cW,cH);
  cx.save();cx.translate(cW/2,cH/2);cx.scale(scale,scale);cx.translate(-sx,-sy);

  // 背景网格
  cx.strokeStyle='rgba(255,255,255,0.03)';cx.lineWidth=1;
  const gs=80,ox=Math.floor((sx-vw/2)/gs)*gs,oy=Math.floor((sy-vh/2)/gs)*gs;
  cx.beginPath();
  for(let x=ox;x<ox+vw+gs;x+=gs){cx.moveTo(x,sy-vh/2);cx.lineTo(x,sy+vh/2)}
  for(let y=oy;y<oy+vh+gs;y+=gs){cx.moveTo(sx-vw/2,y);cx.lineTo(sx+vw/2,y)}
  cx.stroke();

  // 世界边界
  cx.strokeStyle='rgba(255,100,150,0.3)';cx.lineWidth=3;cx.strokeRect(0,0,WW,WH);
  cx.strokeStyle='rgba(255,100,150,0.08)';cx.lineWidth=20;cx.strokeRect(-10,-10,WW+20,WH+20);

  // 装饰粒子
  for(const d of decos){const dx=d.x-sx,dy=d.y-sy;
    if(Math.abs(dx)>vw*0.6||Math.abs(dy)>vh*0.6)continue;
    cx.globalAlpha=0.12+Math.sin(ts/800+d.ph)*0.06;cx.fillStyle=d.c;
    cx.beginPath();cx.arc(d.x,d.y,d.r,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;

  // Fever背景发光
  if(feverOn){cx.fillStyle='rgba(255,107,157,'+(0.04+Math.sin(ts/400)*0.03)+')';
    cx.fillRect(sx-vw/2,sy-vh/2,vw,vh);
    cx.fillStyle='rgba(77,219,255,'+(0.03+Math.sin(ts/600)*0.02)+')';
    cx.fillRect(sx-vw/2,sy-vh/2,vw,vh)}

  // 食物
  for(const f of foods){const dx=f.x-sx,dy=f.y-sy;
    if(Math.abs(dx)>vw*0.6||Math.abs(dy)>vh*0.6)continue;
    drawFood(f,ts)}

  // 宝箱
  for(const c of chests){const dx=c.x-sx,dy=c.y-sy;
    if(Math.abs(dx)>vw*0.6||Math.abs(dy)>vh*0.6)continue;
    drawChest(c,ts)}

  // 磁铁范围
  if(magOn&&ts<magEnd){cx.strokeStyle='rgba(77,219,255,0.2)';cx.lineWidth=1.5;
    cx.setLineDash([5,3]);cx.beginPath();cx.arc(sx,sy,120+magRB*40,0,Math.PI*2);cx.stroke();cx.setLineDash([])}

  // 蛇身
  const totalSegs=snake.len+snake.grow;
  const blen=DC.body.length;const isInv=invOn&&ts<invEnd;
  // 从尾到头画
  for(let i=totalSegs-1;i>=1;i--){
    const ti=i*BODY_SPACE;if(ti>=trail.length)continue;
    const p=trail[ti];const dx=p.x-sx,dy=p.y-sy;
    if(Math.abs(dx)>vw*0.6||Math.abs(dy)>vh*0.6)continue;
    if(isInv&&Math.floor(ts/100)%2===0)cx.globalAlpha=0.5;
    const r=BODY_R*(1-i*0.003);// 越尾越小
    if(feverOn){cx.fillStyle=DC.rainbow[i%DC.rainbow.length]}
    else{cx.fillStyle=DC.body[(i-1)%blen]}
    cx.beginPath();cx.arc(p.x,p.y,Math.max(4,r),0,Math.PI*2);cx.fill();
    // 高光
    cx.fillStyle='rgba(255,255,255,0.15)';cx.beginPath();
    cx.arc(p.x-r*0.2,p.y-r*0.3,r*0.4,0,Math.PI*2);cx.fill();
    cx.globalAlpha=1}

  // 蛇头
  if(!(isInv&&Math.floor(ts/100)%2===0)){
    // 发光
    const gr=cx.createRadialGradient(sx,sy,HEAD_R*0.3,sx,sy,HEAD_R*2.5);
    gr.addColorStop(0,DC.head+'66');gr.addColorStop(1,DC.head+'00');
    cx.fillStyle=gr;cx.fillRect(sx-HEAD_R*3,sy-HEAD_R*3,HEAD_R*6,HEAD_R*6);
    // 头
    const hg=cx.createRadialGradient(sx-2,sy-2,2,sx,sy,HEAD_R);
    hg.addColorStop(0,'#FF8DB5');hg.addColorStop(1,DC.head);
    cx.fillStyle=hg;cx.beginPath();cx.arc(sx,sy,HEAD_R,0,Math.PI*2);cx.fill();
    // 眼睛
    const eOff=HEAD_R*0.4,eR=HEAD_R*0.35,pR=HEAD_R*0.2;
    const ex1=sx+Math.cos(sHeading-0.5)*eOff,ey1=sy+Math.sin(sHeading-0.5)*eOff;
    const ex2=sx+Math.cos(sHeading+0.5)*eOff,ey2=sy+Math.sin(sHeading+0.5)*eOff;
    cx.fillStyle='#fff';cx.beginPath();cx.arc(ex1,ey1,eR,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(ex2,ey2,eR,0,Math.PI*2);cx.fill();
    const px=Math.cos(sHeading)*pR*0.5,py=Math.sin(sHeading)*pR*0.5;
    cx.fillStyle='#1a1035';cx.beginPath();cx.arc(ex1+px,ey1+py,pR,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(ex2+px,ey2+py,pR,0,Math.PI*2);cx.fill()}

  // 尾迹粒子
  for(const p of trailP){cx.globalAlpha=p.life*0.5;cx.fillStyle=p.color;
    cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;

  // 爆炸粒子
  for(const p of particles){cx.globalAlpha=p.life;cx.fillStyle=p.color;
    cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;

  // 浮动文字
  for(const f of fTexts){cx.globalAlpha=f.life;cx.fillStyle=f.color;
    cx.font='bold '+f.size+'px Fredoka One,sans-serif';cx.textAlign='center';
    cx.fillText(f.text,f.x,f.y)}
  cx.globalAlpha=1;cx.textAlign='start';

  cx.restore();

  // 摇杆绘制
  if(jActive&&jTouch){
    cx.globalAlpha=0.25;cx.fillStyle='#fff';cx.beginPath();cx.arc(jCX,jCY,JR,0,Math.PI*2);cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.4)';cx.lineWidth=2;cx.stroke();
    const kx=jCX+jDX*JR,ky=jCY+jDY*JR;
    cx.globalAlpha=0.5;
    const kg=cx.createRadialGradient(kx,ky,5,kx,ky,30);
    kg.addColorStop(0,'#fff');kg.addColorStop(1,'rgba(255,107,157,0.5)');
    cx.fillStyle=kg;cx.beginPath();cx.arc(kx,ky,28,0,Math.PI*2);cx.fill();
    cx.globalAlpha=1}

  // 闪光
  if(flashA>0.01){cx.globalAlpha=flashA;cx.fillStyle='#FFD700';cx.fillRect(0,0,cW,cH);
    cx.globalAlpha=1;flashA*=0.9}
}

function drawFood(f,ts){
  const pulse=Math.sin(ts/200+f.x)*0.3+0.7;
  const r=FOOD_R*0.5*(0.85+pulse*0.15)*(f.type==='rainbow'?1.3:f.type==='gold'?1.1:1);
  const gr=r*2.5;const gc=f.type==='rainbow'?'#FFE44D':f.color;
  const glow=cx.createRadialGradient(f.x,f.y,r*0.3,f.x,f.y,gr);
  glow.addColorStop(0,gc);glow.addColorStop(0.4,gc+'44');glow.addColorStop(1,gc+'00');
  cx.fillStyle=glow;cx.fillRect(f.x-gr,f.y-gr,gr*2,gr*2);
  if(f.type==='rainbow'){
    const rg=cx.createLinearGradient(f.x-r,f.y-r,f.x+r,f.y+r);
    const rc=DC.rainbow,sh=(ts/500)%1;
    for(let i=0;i<rc.length;i++)rg.addColorStop(((i/rc.length)+sh)%1,rc[i]);
    rg.addColorStop(1,rc[0]);cx.beginPath();cx.arc(f.x,f.y,r,0,Math.PI*2);cx.fillStyle=rg;cx.fill();
    const sa=ts/300;for(let s=0;s<4;s++){const a=sa+s*Math.PI/2;
      cx.fillStyle='rgba(255,255,255,'+(0.5+Math.sin(ts/100+s)*0.3)+')';
      cx.beginPath();cx.arc(f.x+Math.cos(a)*r*0.6,f.y+Math.sin(a)*r*0.6,1.2,0,Math.PI*2);cx.fill()}
  }else{cx.beginPath();cx.arc(f.x,f.y,r,0,Math.PI*2);cx.fillStyle=f.color;cx.fill();
    if(f.type==='gold'){cx.fillStyle='rgba(255,215,0,0.3)';cx.beginPath();
      cx.arc(f.x,f.y,r*1.3,0,Math.PI*2);cx.fill()}}
  cx.beginPath();cx.arc(f.x-r*0.25,f.y-r*0.25,r*0.3,0,Math.PI*2);
  cx.fillStyle='rgba(255,255,255,0.4)';cx.fill()}

function drawChest(c,ts){
  const fy=Math.sin(ts/300)*2,s=22;
  const gr=cx.createRadialGradient(c.x,c.y+fy,s*0.3,c.x,c.y+fy,s*1.8);
  gr.addColorStop(0,'rgba(255,215,0,0.35)');gr.addColorStop(1,'rgba(255,215,0,0)');
  cx.fillStyle=gr;cx.fillRect(c.x-s*2,c.y+fy-s*2,s*4,s*4);
  cx.fillStyle='#DAA520';cx.fillRect(c.x-s/2,c.y+fy-s/4,s,s*0.55);
  cx.fillStyle='#FFD700';cx.fillRect(c.x-s/2-1.5,c.y+fy-s/2,s+3,s*0.28);
  cx.fillStyle='#FFF';cx.fillRect(c.x-2.5,c.y+fy-s/6,5,5);
  cx.fillStyle='#FF4444';cx.fillRect(c.x-1.2,c.y+fy-s/2,2.4,s*0.85);
  cx.fillRect(c.x-s/2,c.y+fy-1.2,s,2.4)}

// ===== 主循环 =====
function loop(ts){
  if(!running)return;requestAnimationFrame(loop);
  if(!lastTs){lastTs=ts;return}
  const dt=Math.min((ts-lastTs)/1000,0.05);lastTs=ts;
  if(!paused)update(dt,ts);
  draw(ts)}

function gameOver(){running=false;spMu();
  const isNew=score>bestSc;
  if(isNew){bestSc=score;localStorage.setItem('snb',bestSc);document.getElementById('bs').textContent=bestSc}
  const el=Math.floor((performance.now()-startTime)/1000);
  document.getElementById('fs').textContent=score;
  document.getElementById('nr').style.display=isNew?'block':'none';
  document.getElementById('gb').textContent=bestSc;
  document.getElementById('gc').textContent=maxC;
  document.getElementById('gf').textContent=feverCnt;
  document.getElementById('gch').textContent=chestCnt;
  document.getElementById('gt').textContent=String(Math.floor(el/60)).padStart(2,'0')+':'+String(el%60).padStart(2,'0');
  document.getElementById('go').style.display='block'}

function togglePause(){if(!running)return;
  if(document.getElementById('tp').style.display!=='none')return;
  paused=!paused;document.getElementById('ps').style.display=paused?'block':'none';
  if(paused)spMu();else if(muOn)stMu()}

document.getElementById('sbtn').onclick=startGame;
document.getElementById('rb').onclick=startGame;
document.getElementById('pb').onclick=togglePause;
document.getElementById('rsb').onclick=togglePause;

// 初始绘制
cx.fillStyle=DC.bg1;cx.fillRect(0,0,cW,cH);
</script>
